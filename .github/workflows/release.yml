name: Release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - docs/releases/v1.4.3.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: github.repository == 'zlxmygit/brand-takedown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_source.py
          mkdir -p "$RUNNER_TEMP/release-assets"
          python scripts/package_skill.py --out "$RUNNER_TEMP/release-assets/brand-takedown-v1.4.3.zip"
          cd "$RUNNER_TEMP/release-assets"
          sha256sum brand-takedown-v1.4.3.zip > SHA256SUMS.txt
      - name: Publish verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: zlxmygit/brand-takedown
        run: |
          set -euo pipefail
          tag=v1.4.3
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -Fxq "$tag"; then
            echo 'Release already exists; refusing to replace it.'
            exit 1
          fi
          test "$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq 'length')" = 0
          assets="$RUNNER_TEMP/release-assets"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" \
            --notes-file docs/releases/v1.4.3.md "$assets/brand-takedown-v1.4.3.zip" "$assets/SHA256SUMS.txt"
          gh release download "$tag" --dir "$RUNNER_TEMP/draft-check"
          (cd "$RUNNER_TEMP/draft-check" && sha256sum -c SHA256SUMS.txt)
          cmp "$assets/brand-takedown-v1.4.3.zip" "$RUNNER_TEMP/draft-check/brand-takedown-v1.4.3.zip"
          gh release edit "$tag" --draft=false --prerelease=false --latest
          gh release download "$tag" --dir "$RUNNER_TEMP/published-check"
          (cd "$RUNNER_TEMP/published-check" && sha256sum -c SHA256SUMS.txt)
          cmp "$assets/brand-takedown-v1.4.3.zip" "$RUNNER_TEMP/published-check/brand-takedown-v1.4.3.zip"
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" = "$tag"
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.assets|length')" = 2
