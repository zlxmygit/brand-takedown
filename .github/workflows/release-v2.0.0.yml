name: Release v2.0.0
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v2.0.0.yml
      - docs/releases/v2.0.0.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-v2.0.0
  cancel-in-progress: false
env:
  RELEASE_TAG: v2.0.0
  PACKAGE_SHA256: 50d720b8cedba4cae0aeb3f2d844946732530f7de84e7d5f5e8660f2e459e08f
jobs:
  verify:
    if: github.repository == 'zlxmygit/brand-takedown' && github.ref == 'refs/heads/main'
    name: Release verify (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify source manifest and private artifact exclusion
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import hashlib,json,pathlib; d=json.loads(pathlib.Path("docs/source-checksums.json").read_text()); bad=[p for p,h in d["files"].items() if hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()!=h]; assert not bad,bad; print("Verified",len(d["files"]),"source files")'
          if git ls-files | grep -Ei '(^|/)(cases|certificates|evidence|packets)/|(^|/)(profile|registry|case|radar_seen|evidence-manifest|recon-report)\.json$|\.(eml|pdf|png|jpe?g|har|pem|key)$|(^|/)\.env($|\.)'; then
            echo 'Private runtime artifacts must not be tracked.'
            exit 1
          fi
      - name: Source and extracted-package regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python scripts/doctor.py
          python scripts/brand_registry.py validate --profile-file examples/sample-profile.json
          python -m unittest discover -s tests -v
          python scripts/package_skill.py --out "$RUNNER_TEMP/first.zip"
          python scripts/package_skill.py --out "$RUNNER_TEMP/second.zip"
          cmp "$RUNNER_TEMP/first.zip" "$RUNNER_TEMP/second.zip"
          python -m zipfile -e "$RUNNER_TEMP/first.zip" "$RUNNER_TEMP/extracted"
          cd "$RUNNER_TEMP/extracted/brand-takedown"
          python -c 'import hashlib,pathlib; rows=pathlib.Path("SHA256SUMS.txt").read_text().splitlines(); assert len(rows)==40; assert all(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h for h,p in (row.split("  ",1) for row in rows))'
          python -m unittest discover -s tests -v
  publish:
    needs: verify
    if: github.repository == 'zlxmygit/brand-takedown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build and verify exact release assets
        shell: bash
        run: |
          set -euo pipefail
          export ASSET_DIR="$RUNNER_TEMP/release-assets"
          mkdir -p "$ASSET_DIR"
          python scripts/package_skill.py --out "$ASSET_DIR/brand-takedown-v2.0.0.zip"
          cp docs/releases/v2.0.0.md "$ASSET_DIR/RELEASE-NOTES.zh-CN.md"
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, zipfile
          sys.path.insert(0, 'scripts')
          from package_skill import FILES
          folder = pathlib.Path(os.environ['ASSET_DIR'])
          package = folder / 'brand-takedown-v2.0.0.zip'
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          assert digest == os.environ['PACKAGE_SHA256'], 'Package differs from locally tested bytes'
          with zipfile.ZipFile(package) as archive:
              expected = {'brand-takedown/' + p for p in FILES} | {'brand-takedown/SHA256SUMS.txt'}
              assert set(archive.namelist()) == expected
              for row in archive.read('brand-takedown/SHA256SUMS.txt').decode().splitlines():
                  h, name = row.split('  ', 1)
                  assert hashlib.sha256(archive.read('brand-takedown/' + name)).hexdigest() == h
          data = {
              'version': os.environ['RELEASE_TAG'],
              'source_commit': os.environ['GITHUB_SHA'],
              'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'audited_runtime_baseline': 'f59e84e42b3052131a6b40cdce67c7647ce9e628',
              'workflow_url': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'verification': {'distinct_tests': 150, 'source_suite': 'passed', 'extracted_package_suite': 'passed',
                               'matrix': ['ubuntu-24.04/python3.11', 'ubuntu-24.04/python3.13', 'macos-15/python3.11', 'macos-15/python3.13'],
                               'source_manifest': 'passed', 'private_artifact_guard': 'passed', 'reproducible_build': 'passed'},
              'package': {'filename': package.name, 'sha256': digest, 'size_bytes': package.stat().st_size, 'members': len(expected)},
              'scope': 'Human-supervised evidence and draft workflow; no live complaints or private case data.'
          }
          (folder / 'VALIDATION.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          cd "$ASSET_DIR"
          sha256sum brand-takedown-v2.0.0.zip RELEASE-NOTES.zh-CN.md VALIDATION.json > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Upload draft, read back, publish, and verify published assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: zlxmygit/brand-takedown
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -Fxq "$RELEASE_TAG"; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          test "$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq 'length')" = '0'
          ASSET_DIR="$RUNNER_TEMP/release-assets"
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft \
            --title 'v2.0.0 — 安全重构正式版 / Reviewed Brand Takedown Skill' \
            --notes-file docs/releases/v2.0.0.md \
            "$ASSET_DIR/brand-takedown-v2.0.0.zip" "$ASSET_DIR/SHA256SUMS.txt" \
            "$ASSET_DIR/VALIDATION.json" "$ASSET_DIR/RELEASE-NOTES.zh-CN.md"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/draft-readback"
          (cd "$RUNNER_TEMP/draft-readback" && sha256sum -c SHA256SUMS.txt)
          for asset in brand-takedown-v2.0.0.zip SHA256SUMS.txt VALIDATION.json RELEASE-NOTES.zh-CN.md; do
            cmp "$ASSET_DIR/$asset" "$RUNNER_TEMP/draft-readback/$asset"
          done
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" = "$RELEASE_TAG"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/published-readback"
          (cd "$RUNNER_TEMP/published-readback" && sha256sum -c SHA256SUMS.txt)
          for asset in brand-takedown-v2.0.0.zip SHA256SUMS.txt VALIDATION.json RELEASE-NOTES.zh-CN.md; do
            cmp "$ASSET_DIR/$asset" "$RUNNER_TEMP/published-readback/$asset"
          done
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '{tag_name,draft,prerelease,html_url,assets:[.assets[]|{name,size,state,digest}]}'
          printf 'Published %s at commit %s. Four assets read back and verified before and after publication.\n' "$RELEASE_TAG" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
