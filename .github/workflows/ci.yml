name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Guard against private brand artifacts or evidence leaks
        run: |
          set -euo pipefail
          FORBIDDEN=$(git ls-files | grep -E '\.(eml|pdf|png|jpg|jpeg|har)$|(^|/)(profile|registry|case|evidence-manifest|recon-report)\.json$' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "ERROR: Private brand or case artifacts detected in tracked files:"
            echo "$FORBIDDEN"
            exit 1
          fi

      - name: Validate generic sample profile against schema
        run: python3 scripts/brand_registry.py validate --profile-file examples/sample-profile.json

      - name: Run unit and skill integrity test suite
        run: python3 -m unittest discover -s tests -v
