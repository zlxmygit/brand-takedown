name: Safety and regression CI
on:
  push:
    branches: [main, "fix/audit-hardening-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python: ["3.11", "3.13"]
    env:
      PYTHONUTF8: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install platform data
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Verify exact sources
        run: python scripts/verify_source.py
      - name: Compile and diagnose
        run: python scripts/check_distribution.py --smoke
      - name: Offline negative and workflow tests
        run: python -m unittest discover -s tests -v
      - name: Tracked private artifact guard
        run: python scripts/check_distribution.py --tracked
      - name: Test installed package and reproducibility
        run: python scripts/check_distribution.py --package
      - name: PowerShell quick start
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:BRAND_TAKEDOWN_REGISTRY = Join-Path $env:RUNNER_TEMP '跨平台 入门/registry.json'
          $profile = Join-Path $env:RUNNER_TEMP '跨平台 入门/input.json'
          New-Item -ItemType Directory -Force (Split-Path $profile) | Out-Null
          Copy-Item examples/sample-profile.json $profile
          python scripts/brand_registry.py init --slug example-brand --data-dir (Join-Path (Split-Path $profile) 'brand') --profile-file $profile
          if ($LASTEXITCODE -ne 0) { throw 'Brand registration failed' }
          python scripts/case_manager.py create --slug example-brand --url 'https://suspect.example/product' --types COPYRIGHT_CLONE
          if ($LASTEXITCODE -ne 0) { throw 'Case creation failed' }
          python scripts/case_manager.py summary --slug example-brand
          if ($LASTEXITCODE -ne 0) { throw 'Case summary failed' }
