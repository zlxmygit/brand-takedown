name: Safety and regression CI
on:
  push:
    branches: [main, "fix/audit-hardening-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python: ["3.11", "3.13"]
    env:
      PYTHONUTF8: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install platform data
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Verify exact sources
        run: python scripts/verify_source.py
      - name: Compile and diagnose
        run: python scripts/check_distribution.py --smoke
      - name: Offline negative and workflow tests
        run: python -m unittest discover -s tests -v
      - name: Tracked private artifact guard
        run: python scripts/check_distribution.py --tracked
      - name: Test installed package and reproducibility
        run: python scripts/check_distribution.py --package
      - name: PowerShell 7 quick start
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/powershell_smoke.ps1
      - name: Windows PowerShell 5.1 quick start
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/powershell_smoke.ps1
