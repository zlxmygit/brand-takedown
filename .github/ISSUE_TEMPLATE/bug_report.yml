name: Sanitized bug report
description: Report a defect with synthetic data only
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not disclose certificates, private cases, email headers, credentials or live enforcement targets. Security issues belong in the private reporting route when enabled."
  - type: input
    id: environment
    attributes:
      label: OS, Python version and commit
      placeholder: "macOS / Windows / Linux, Python version, commit SHA"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction and expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: No private brand, case or credential data is included.
          required: true
