name: Bug Report
description: Report a bug in scripts, state transitions, recon parsing, or templates (strictly sanitized)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > **PRIVACY WARNING**: Do **NOT** paste real trademark/patent certificates, private `profile.json` data, corporate email headers, or live confidential case files. Replace all domain/brand names with synthetic examples such as `official-acme.example` and `infringing-clone.example`.
  - type: checkboxes
    id: sanitization_check
    attributes:
      label: Data Sanitization Confirmation
      options:
        - label: I confirm this report contains NO real brand credentials, certificates, or confidential case records.
          required: true
  - type: input
    id: environment
    attributes:
      label: OS & Python Version
      placeholder: "macOS 15.x / Ubuntu 24.04, Python 3.9.6"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal command or workflow steps using synthetic inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
    validations:
      required: true
